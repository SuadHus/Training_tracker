name: Health sync

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: Europe/Stockholm
    - cron: "17 14 * * *"
      timezone: Europe/Stockholm
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh connected health providers
        env:
          HEALTH_SYNC_SECRET: ${{ secrets.HEALTH_SYNC_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 90 \
            --request POST --header "Authorization: Bearer $HEALTH_SYNC_SECRET" \
            'https://training-tracker-421a9edd04a6.herokuapp.com/api/connections/sync')
          if jq -e '(.results | length) > 0 and (.results | all(.outcome != "failed")) and (.results | any(.outcome == "synced" or .outcome == "busy"))' <<<"$response" >/dev/null; then
            echo "Health sync completed."
          else
            echo "::error::Health sync did not complete. Check the app’s Health connections page."
            exit 1
          fi
